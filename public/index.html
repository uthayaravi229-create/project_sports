<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Sports Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏆 College Sports Registration</h1>
        <p>Register to participate in our college sports event</p>
    </header>


    <main>

        <!-- Registration Form -->

        <section class="form-container">

            <h2>Student Registration</h2>

            <form id="registrationForm">

                <div class="form-group">
                    <label>Student Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Register Number</label>

                    <input
                        type="text"
                        id="registerNumber"
                        placeholder="Enter register number"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Department</label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="B.Sc Computer Science">
                            B.Sc Computer Science
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="B.Com">
                            B.Com
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                        <option value="B.Sc Mathematics">
                            B.Sc Mathematics
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Year</label>

                    <select id="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Gender</label>

                    <select id="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="student@gmail.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Sport</label>

                    <select id="sport" required>

                        <option value="">
                            Select Sport
                        </option>

                        <option value="Cricket">
                            Cricket
                        </option>

                        <option value="Football">
                            Football
                        </option>

                        <option value="Basketball">
                            Basketball
                        </option>

                        <option value="Volleyball">
                            Volleyball
                        </option>

                        <option value="Badminton">
                            Badminton
                        </option>

                        <option value="Table Tennis">
                            Table Tennis
                        </option>

                        <option value="Athletics">
                            Athletics
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Event</label>

                    <select id="event" required>

                        <option value="">
                            Select Event
                        </option>

                        <option value="Singles">
                            Singles
                        </option>

                        <option value="Doubles">
                            Doubles
                        </option>

                        <option value="Team">
                            Team
                        </option>

                    </select>
                </div>


                <button type="submit">
                    Register Now
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- Registered Students -->

        <section class="students-container">

            <h2>Registered Students</h2>

            <button
                class="refresh-btn"
                onclick="loadStudents()"
            >
                Refresh List
            </button>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Name</th>
                            <th>Register No</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Sport</th>
                            <th>Event</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 College Sports Event
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
